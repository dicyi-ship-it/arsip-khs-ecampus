<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · STTI NIIT ITECH</title><link rel="stylesheet" href="/style.css"><script src="/login.js" type="module"></script></head><body>
<main class="login-page"><section class="panel login-card"><p class="eyebrow">STTI NIIT ITECH</p><h1 id="title">Masuk ke arsip</h1><p class="muted" id="intro">Gunakan akun yang diberikan oleh super admin.</p>
<form id="loginForm"><label id="setupName" hidden>Nama lengkap<input name="name" maxlength="100" autocomplete="name"></label><label>Username<input name="username" required minlength="3" maxlength="50" autocomplete="username" pattern="[a-zA-Z0-9._-]{3,50}"></label><label>Password<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label><label id="setupToken" hidden>Kode aktivasi<input name="token" autocomplete="off"><small>Buka file data/setup-token.txt pada komputer server.</small></label><button class="primary" type="submit">Masuk</button></form><p id="message" role="status" aria-live="polite"></p></section></main></body></html>
