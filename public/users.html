<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengguna · STTI NIIT ITECH</title><link rel="stylesheet" href="/style.css"><script src="/account.js" type="module"></script></head><body><header><a href="/" class="brand">← Arsip ITECH</a></header><main><p class="eyebrow">SUPER ADMIN</p><h1>Kelola pengguna</h1><p class="muted">Pengguna dapat mencari mahasiswa dan mengunduh transkrip ITECH. Hanya super admin yang dapat membuat akun.</p><section class="panel"><div class="panel-title"><h2>Tambah pengguna</h2></div><form id="userForm"><label>Nama lengkap<input name="name" required maxlength="100" autocomplete="off"></label><label>Username<input name="username" required pattern="[a-zA-Z0-9._-]{3,50}" minlength="3" maxlength="50" autocomplete="off"></label><label>Password (minimal 12 karakter)<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button class="primary">Tambah pengguna</button></form><p id="userMessage" class="notice" role="status"></p></section><section class="panel"><div class="panel-title"><h2>Daftar akun</h2></div><div class="table-wrap"><table><thead><tr><th>Username</th><th>Nama</th><th>Peran</th></tr></thead><tbody id="userRows"></tbody></table></div></section></main></body></html>
